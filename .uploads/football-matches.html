<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Hub - Match Center</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0e17;
    --bg-surface: #111827;
    --bg-card: #1a2235;
    --bg-card-hover: #1f2a40;
    --accent-green: #00e676;
    --accent-green-dim: #00c853;
    --accent-orange: #ff6d00;
    --accent-red: #ff1744;
    --accent-blue: #2979ff;
    --text-primary: #f0f4f8;
    --text-secondary: #8899aa;
    --text-muted: #556677;
    --border-subtle: rgba(255,255,255,0.06);
    --border-accent: rgba(0,230,118,0.3);
    --glow-green: 0 0 20px rgba(0,230,118,0.15);
    --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background atmosphere */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -20%;
    width: 80vw;
    height: 80vw;
    background: radial-gradient(ellipse, rgba(0,230,118,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -20%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(ellipse, rgba(41,121,255,0.03) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Noise texture overlay */
  .noise-overlay {
    position: fixed;
    inset: 0;
    opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* ===== HEADER ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,14,23,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: #000;
    box-shadow: var(--glow-green);
  }
  .logo-text {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .logo-text span { color: var(--accent-green); }

  .header-nav {
    display: flex;
    gap: 8px;
  }
  .nav-pill {
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid transparent;
    background: transparent;
  }
  .nav-pill:hover {
    color: var(--text-primary);
    background: rgba(255,255,255,0.05);
  }
  .nav-pill.active {
    color: var(--accent-green);
    background: rgba(0,230,118,0.08);
    border-color: var(--border-accent);
  }

  /* ===== PAGE TITLE SECTION ===== */
  .page-hero {
    position: relative;
    z-index: 1;
    padding: 40px 24px 24px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .page-hero h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .page-hero h1 .highlight {
    color: var(--accent-green);
    position: relative;
  }
  .page-hero h1 .highlight::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, var(--accent-green), transparent);
    border-radius: 2px;
  }
  .page-hero .subtitle {
    margin-top: 12px;
    font-size: 16px;
    color: var(--text-secondary);
    font-weight: 300;
    letter-spacing: 0.5px;
  }

  .stats-bar {
    display: flex;
    gap: 24px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-card);
    border-radius: var(--radius-xs);
    border: 1px solid var(--border-subtle);
    font-size: 13px;
  }
  .stat-chip .stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .stat-chip .stat-dot.live { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); animation: pulse-dot 1.5s infinite; }
  .stat-chip .stat-dot.scheduled { background: var(--accent-blue); }
  .stat-chip .stat-dot.finished { background: var(--text-muted); }
  .stat-chip .stat-value { font-weight: 600; color: var(--text-primary); }
  .stat-chip .stat-label { color: var(--text-secondary); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* ===== MASONRY / WATERFALL LAYOUT ===== */
  .masonry-container {
    position: relative;
    z-index: 1;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px 60px;
    columns: 2;
    column-gap: 18px;
  }

  @media (max-width: 768px) {
    .masonry-container { columns: 1; column-gap: 14px; }
    .page-hero h1 { font-size: 28px; }
    .header-nav { display: none; }
    .stats-bar { gap: 10px; }
    .stat-chip { padding: 6px 12px; font-size: 12px; }
  }
  @media (min-width: 769px) and (max-width: 1024px) {
    .masonry-container { columns: 2; }
  }
  @media (min-width: 1400px) {
    .masonry-container { columns: 3; }
  }

  /* ===== MATCH CARD ===== */
  .match-card {
    break-inside: avoid;
    margin-bottom: 18px;
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border-subtle);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0;
    transform: translateY(30px);
    animation: cardReveal 0.6s ease forwards;
  }
  .match-card:nth-child(1) { animation-delay: 0.05s; }
  .match-card:nth-child(2) { animation-delay: 0.1s; }
  .match-card:nth-child(3) { animation-delay: 0.15s; }
  .match-card:nth-child(4) { animation-delay: 0.2s; }
  .match-card:nth-child(5) { animation-delay: 0.25s; }
  .match-card:nth-child(6) { animation-delay: 0.3s; }
  .match-card:nth-child(7) { animation-delay: 0.35s; }
  .match-card:nth-child(8) { animation-delay: 0.4s; }
  .match-card:nth-child(9) { animation-delay: 0.45s; }
  .match-card:nth-child(10) { animation-delay: 0.5s; }

  @keyframes cardReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .match-card:hover {
    transform: translateY(-4px);
    border-color: var(--border-accent);
    box-shadow: var(--glow-green), var(--shadow-card);
  }

  .match-card-image {
    width: 100%;
    display: block;
    transition: transform 0.4s ease;
  }
  /* Waterfall: vary image heights per card */
  .match-card-image.h-sm { aspect-ratio: 16/9; }
  .match-card-image.h-md { aspect-ratio: 16/11; }
  .match-card-image.h-lg { aspect-ratio: 16/13; }
  .match-card-image.h-xl { aspect-ratio: 1/1; }
  .match-card-image { object-fit: cover; }
  .match-card:hover .match-card-image {
    transform: scale(1.03);
  }
  .match-card-image-wrapper {
    overflow: hidden;
    position: relative;
  }

  /* Status badge on image */
  .match-status-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 2;
  }
  .match-status-badge.live {
    background: var(--accent-red);
    color: #fff;
    box-shadow: 0 0 12px rgba(255,23,68,0.5);
    animation: pulse-badge 1.5s infinite;
  }
  .match-status-badge.scheduled {
    background: rgba(10,14,23,0.75);
    color: var(--accent-blue);
    backdrop-filter: blur(8px);
  }
  .match-status-badge.finished {
    background: rgba(10,14,23,0.75);
    color: var(--text-muted);
    backdrop-filter: blur(8px);
  }

  @keyframes pulse-badge {
    0%, 100% { box-shadow: 0 0 12px rgba(255,23,68,0.5); }
    50% { box-shadow: 0 0 20px rgba(255,23,68,0.8); }
  }

  .match-minute-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(10,14,23,0.75);
    backdrop-filter: blur(8px);
    font-size: 12px;
    font-weight: 600;
    color: var(--accent-orange);
    font-family: 'Oswald', sans-serif;
  }

  .match-card-body {
    padding: 14px;
  }

  /* League tag */
  .league-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .league-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-green);
  }

  /* Teams */
  .match-teams {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .match-team-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .team-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .team-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .team-name {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .team-score {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    min-width: 20px;
    text-align: center;
  }
  .team-score.winner { color: var(--accent-green); }

  /* Card footer */
  .match-card-footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
  }
  .match-venue {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .match-date {
    font-weight: 500;
  }

  /* Extra info (goals scorers) */
  .match-scorers {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  .scorer-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .scorer-item .goal-icon {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    flex-shrink: 0;
  }

  /* ===== DETAIL PAGE (SLIDE-IN OVERLAY) ===== */
  .detail-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .detail-overlay.active {
    pointer-events: all;
    opacity: 1;
  }

  .detail-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
  }

  .detail-panel {
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    max-width: 520px;
    height: 100vh;
    background: var(--bg-deep);
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
  }
  .detail-overlay.active .detail-panel {
    transform: translateX(0);
  }

  /* Detail header */
  .detail-close {
    position: fixed;
    top: 16px;
    right: 536px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(10,14,23,0.8);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1001;
    opacity: 0;
    transition: all 0.35s ease;
    pointer-events: none;
  }
  .detail-overlay.active .detail-close {
    opacity: 1;
    pointer-events: all;
    right: calc(min(520px, 100%) + 16px);
  }
  .detail-close:hover {
    background: var(--accent-green);
    color: #000;
    transform: scale(1.1);
  }

  /* Carousel */
  .carousel-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    overflow: hidden;
    background: var(--bg-surface);
  }
  .carousel-track {
    display: flex;
    height: 100%;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .carousel-slide {
    min-width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .carousel-dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  .carousel-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .carousel-dot.active {
    background: var(--accent-green);
    width: 24px;
    border-radius: 4px;
  }
  .carousel-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(10,14,23,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-subtle);
    color: #fff;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .carousel-container:hover .carousel-arrow { opacity: 1; }
  .carousel-arrow:hover { background: var(--accent-green); color: #000; }
  .carousel-arrow.prev { left: 12px; }
  .carousel-arrow.next { right: 12px; }

  /* Detail body */
  .detail-body {
    padding: 24px 20px 40px;
  }

  .detail-status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .detail-league {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
    color: var(--accent-green);
  }
  .detail-status-text {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 4px;
  }

  .detail-match-title {
    font-family: 'Oswald', sans-serif;
    font-size: 28px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    line-height: 1.2;
    margin: 8px 0 24px;
    color: var(--text-primary);
  }

  /* Score section */
  .detail-scoreboard {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 0;
    margin-bottom: 24px;
    background: var(--bg-card);
    border-radius: var(--radius);
    border: 1px solid var(--border-subtle);
    position: relative;
    overflow: hidden;
  }
  .detail-scoreboard::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
  }

  .detail-team-block {
    flex: 1;
    text-align: center;
  }
  .detail-team-logo {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .detail-team-name {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  .detail-score-center {
    text-align: center;
    min-width: 80px;
  }
  .detail-score-numbers {
    font-family: 'Oswald', sans-serif;
    font-size: 48px;
    font-weight: 700;
    letter-spacing: 4px;
    line-height: 1;
  }
  .detail-score-divider {
    width: 100%;
    height: 2px;
    background: var(--border-subtle);
    margin: 10px 0;
  }
  .detail-half-time {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Goal scorers list */
  .detail-scorers-section {
    margin-bottom: 24px;
  }
  .detail-section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .detail-scorer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .detail-scorer-minute {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--accent-green);
    min-width: 32px;
  }
  .detail-scorer-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-green);
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .detail-scorer-icon.penalty {
    background: var(--accent-orange);
  }
  .detail-scorer-name {
    font-weight: 500;
    font-size: 14px;
    flex: 1;
  }
  .detail-scorer-assist {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Info grid */
  .detail-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .info-item {
    background: var(--bg-card);
    border-radius: var(--radius-sm);
    padding: 14px;
    border: 1px solid var(--border-subtle);
  }
  .info-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .info-value {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  /* Match stats */
  .detail-stats {
    margin-bottom: 24px;
  }
  .stat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .stat-row-label {
    flex: 1;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: right;
  }
  .stat-row-bars {
    flex: 1;
    display: flex;
    gap: 4px;
    align-items: center;
    height: 8px;
  }
  .stat-bar-home {
    flex: 1;
    height: 100%;
    background: var(--accent-green);
    border-radius: 4px 0 0 4px;
    transition: width 0.8s ease;
  }
  .stat-bar-away {
    flex: 1;
    height: 100%;
    background: var(--accent-blue);
    border-radius: 0 4px 4px 0;
    transition: width 0.8s ease;
  }
  .stat-row-value-home {
    min-width: 28px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-align: right;
  }
  .stat-row-value-away {

// ===== RENDER CARDS =====
function renderCards() {
  const container = document.getElementById('matchList');
  container.innerHTML = matches.map(m => {
    const statusClass = m.status === 'live' ? 'live' : m.status === 'finished' ? 'finished' : 'scheduled';
    const statusLabel = m.status === 'live' ? 'LIVE' : m.status === 'finished' ? 'FT' : 'SCHEDULED';
    const homeWin = m.status === 'finished' || m.status === 'live' ? m.homeScore > m.awayScore : false;
    const awayWin = m.status === 'finished' || m.status === 'live' ? m.awayScore > m.homeScore : false;

    const scorersHTML = (m.homeScorers.length || m.awayScorers.length) ? `
      <div class="match-scorers">
        ${m.homeScorers.map(s => `<div class="scorer-item"><span class="goal-icon">&#9917;</span> ${s.name} ${s.minute}'</div>`).join('')}
        ${m.awayScorers.map(s => `<div class="scorer-item"><span class="goal-icon">&#9917;</span> ${s.name} ${s.minute}'</div>`).join('')}
      </div>
    ` : '';

    return `
      <div class="match-card" onclick="openDetail(${m.id})">
        <div class="match-card-image-wrapper">
          <img class="match-card-image ${m.imgHeight}" src="${m.images[0]}" alt="${m.homeTeam} vs ${m.awayTeam}" loading="lazy">
          <span class="match-status-badge ${statusClass}">${statusLabel}</span>
          ${m.minute ? `<span class="match-minute-badge">${m.minute}</span>` : ''}
        </div>
        <div class="match-card-body">
          <div class="league-tag"><span class="league-dot"></span>${m.league}</div>
          <div class="match-teams">
            <div class="match-team-row">
              <div class="team-info">
                <span class="team-logo">${m.homeLogo}</span>
                <span class="team-name">${m.homeTeam}</span>
              </div>
              <span class="team-score ${homeWin ? 'winner' : ''}">${m.homeScore}</span>
            </div>
            <div class="match-team-row">
              <div class="team-info">
                <span class="team-logo">${m.awayLogo}</span>
                <span class="team-name">${m.awayTeam}</span>
              </div>
              <span class="team-score ${awayWin ? 'winner' : ''}">${m.awayScore}</span>
            </div>
          </div>
          ${scorersHTML}
          <div class="match-card-footer">
            <span class="match-venue">&#128205; ${m.venue}</span>
            <span class="match-date">${m.date} ${m.time}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== DETAIL PAGE =====
let currentSlide = 0;
let currentMatch = null;
let autoSlideTimer = null;

function openDetail(id) {
  currentMatch = matches.find(m => m.id === id);
  if (!currentMatch) return;
  currentSlide = 0;
  renderDetail();
  document.getElementById('detailOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  startAutoSlide();
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('active');
  document.body.style.overflow = '';
  stopAutoSlide();
}

function renderDetail() {
  const m = currentMatch;
  const panel = document.getElementById('detailPanel');

  const statusColors = {
    live: { bg: 'rgba(255,23,68,0.15)', color: 'var(--accent-red)' },
    scheduled: { bg: 'rgba(41,121,255,0.15)', color: 'var(--accent-blue)' },
    finished: { bg: 'rgba(85,102,119,0.15)', color: 'var(--text-muted)' }
  };
  const sc = statusColors[m.status];
  const statusLabel = m.status === 'live' ? 'LIVE NOW' : m.status === 'finished' ? 'COMPLETED' : 'UPCOMING';

  const scorersHTML = (m.homeScorers.length || m.awayScorers.length) ? `
    <div class="detail-scorers-section">
      <div class="detail-section-title">Goal Scorers</div>
      ${m.homeScorers.map(s => `
        <div class="detail-scorer-row">
          <span class="detail-scorer-minute">${s.minute}'</span>
          <span class="detail-scorer-icon ${s.type === 'penalty' ? 'penalty' : ''}">${s.type === 'penalty' ? 'P' : '&#9917;'}</span>
          <span class="detail-scorer-name">${s.name}</span>
          ${s.assist ? `<span class="detail-scorer-assist">AST: ${s.assist}</span>` : ''}
        </div>
      `).join('')}
      ${m.awayScorers.map(s => `
        <div class="detail-scorer-row">
          <span class="detail-scorer-minute">${s.minute}'</span>
          <span class="detail-scorer-icon ${s.type === 'penalty' ? 'penalty' : ''}">${s.type === 'penalty' ? 'P' : '&#9917;'}</span>
          <span class="detail-scorer-name">${s.name}</span>
          ${s.assist ? `<span class="detail-scorer-assist">AST: ${s.assist}</span>` : ''}
        </div>
      `).join('')}
    </div>
  ` : '';

  const statsHTML = m.stats ? `
    <div class="detail-stats">
      <div class="detail-section-title">Match Statistics</div>
      ${Object.entries({
        possession: 'Possession',
        shots: 'Total Shots',
        shotsOnTarget: 'Shots on Target',
        corners: 'Corners',
        fouls: 'Fouls',
        passes: 'Passes'
      }).map(([key, label]) => `
        <div class="stat-row">
          <span class="stat-row-value-home">${m.stats[key][0]}${key === 'possession' ? '%' : ''}</span>
          <span class="stat-row-label">${label}</span>
          <span class="stat-row-value-away">${m.stats[key][1]}${key === 'possession' ? '%' : ''}</span>
        </div>
        <div class="stat-bar-container">
          <div class="stat-bars-row">
            <div class="stat-bar-home" style="flex: ${m.stats[key][0]}"></div>
            <div class="stat-bar-away" style="flex: ${m.stats[key][1]}"></div>
          </div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const lineupHTML = (m.homeLineup.length && m.awayLineup.length) ? `
    <div class="lineup-section">
      <div class="detail-section-title">Lineups</div>
      <div class="lineup-formations">
        <span class="lineup-formation">4-3-3</span>
        <span class="lineup-vs">VS</span>
        <span class="lineup-formation">4-3-3</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="lineup-players">
          ${m.homeLineup.map(p => `
            <div class="lineup-player">
              <span class="lineup-player-num">${p.num}</span>
              <span class="lineup-player-name">${p.name}</span>
              ${p.sub ? `<span class="lineup-player-sub">&#8644; ${p.sub}</span>` : ''}
            </div>
          `).join('')}
        </div>
        <div class="lineup-players">
          ${m.awayLineup.map(p => `
            <div class="lineup-player">
              <span class="lineup-player-num">${p.num}</span>
              <span class="lineup-player-name">${p.name}</span>
              ${p.sub ? `<span class="lineup-player-sub">&#8644; ${p.sub}</span>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  ` : '';

  panel.innerHTML = `
    <div class="carousel-container" id="carouselContainer">
      <div class="carousel-track" id="carouselTrack">
        ${m.images.map(img => `<img class="carousel-slide" src="${img}" alt="Match photo">`).join('')}
      </div>
      <div class="carousel-arrow prev" onclick="slideCarousel(-1)">&#10094;</div>
      <div class="carousel-arrow next" onclick="slideCarousel(1)">&#10095;</div>
      <div class="carousel-dots" id="carouselDots">
        ${m.images.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="goToSlide(${i})"></div>`).join('')}
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-status-row">
        <span class="detail-league"><span class="league-dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-green);margin-right:6px;vertical-align:middle;"></span>${m.league}</span>
        <span class="detail-status-text" style="background:${sc.bg};color:${sc.color}">${statusLabel} ${m.minute || ''}</span>
      </div>
      <h2 class="detail-match-title">${m.homeTeam} vs ${m.awayTeam}</h2>

      <div class="detail-scoreboard">
        <div class="detail-team-block">
          <div class="detail-team-logo">${m.homeLogo}</div>
          <div class="detail-team-name">${m.homeTeam}</div>
        </div>
        <div class="detail-score-center">
          <div class="detail-score-numbers">${m.homeScore} - ${m.awayScore}</div>
          <div class="detail-score-divider"></div>
          <div class="detail-half-time">HT ${m.htScore}</div>
        </div>
        <div class="detail-team-block">
          <div class="detail-team-logo">${m.awayLogo}</div>
          <div class="detail-team-name">${m.awayTeam}</div>
        </div>
      </div>

      <div class="detail-info-grid">
        <div class="info-item">
          <div class="info-label">Date & Time</div>
          <div class="info-value">${m.date}<br><span style="font-size:13px;color:var(--text-secondary)">${m.time}</span></div>
        </div>
        <div class="info-item">
          <div class="info-label">Venue</div>
          <div class="info-value">${m.venue}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Attendance</div>
          <div class="info-value">${m.attendance}</div>
        </div>
        <div class="info-item">
          <div class="info-label">Referee</div>
          <div class="info-value">${m.referee}</div>
        </div>
      </div>

      ${scorersHTML}
      ${statsHTML}
      ${lineupHTML}
    </div>
  `;
}

// Carousel controls
function slideCarousel(dir) {
  if (!currentMatch) return;
  currentSlide = (currentSlide + dir + currentMatch.images.length) % currentMatch.images.length;
  updateCarousel();
  resetAutoSlide();
}

function goToSlide(i) {
  currentSlide = i;
  updateCarousel();
  resetAutoSlide();
}

function updateCarousel() {
  const track = document.getElementById('carouselTrack');
  if (track) track.style.transform = `translateX(-${currentSlide * 100}%)`;
  const dots = document.querySelectorAll('.carousel-dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
}

function startAutoSlide() {
  stopAutoSlide();
  autoSlideTimer = setInterval(() => {
    if (!currentMatch) return;
    currentSlide = (currentSlide + 1) % currentMatch.images.length;
    updateCarousel();
  }, 4000);
}

function stopAutoSlide() {
  if (autoSlideTimer) clearInterval(autoSlideTimer);
}

function resetAutoSlide() {
  stopAutoSlide();
  startAutoSlide();
}

// Touch support for carousel
let touchStartX = 0;
let touchEndX = 0;
document.addEventListener('touchstart', e => {
  if (e.target.closest('.carousel-container')) {
    touchStartX = e.changedTouches[0].screenX;
  }
}, { passive: true });
document.addEventListener('touchend', e => {
  if (e.target.closest('.carousel-container')) {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 50) slideCarousel(diff > 0 ? 1 : -1);
  }
}, { passive: true });

// Event listeners
document.getElementById('detailBackdrop').addEventListener('click', closeDetail);
document.getElementById('detailClose').addEventListener('click', closeDetail);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if (document.getElementById('detailOverlay').classList.contains('active')) {
    if (e.key === 'ArrowLeft') slideCarousel(-1);
    if (e.key === 'ArrowRight') slideCarousel(1);
  }
});

// Init
renderCards();
</script>
</body>
</html>
